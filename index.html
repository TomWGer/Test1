<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krav Maga Kursplaner App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Krav Maga Kursplaner</h1>
      <p class="subtitle">Automatische Kurserstellung für Kinder, Jugendliche und Erwachsene.</p>

      <section class="card">
        <h2>1) Parameter</h2>
        <form id="plannerForm" class="grid">
          <label>
            Zielgruppe
            <select name="gruppe" required>
              <option>Kinder</option>
              <option>Jugendliche</option>
              <option>Erwachsene</option>
            </select>
          </label>

          <label>
            Dauer (Minuten)
            <select name="dauer" required>
              <option value="40">40</option>
              <option value="60">60</option>
              <option value="75" selected>75</option>
              <option value="90">90</option>
            </select>
          </label>

          <label>
            Niveau
            <select name="niveau" required>
              <option>Anfänger</option>
              <option>Mittelstufe</option>
              <option>Fortgeschritten</option>
            </select>
          </label>

          <label>
            Teilnehmerzahl
            <input name="teilnehmer" type="number" min="1" value="12" required />
          </label>

          <label>
            Intensität
            <select name="intensitaet" required>
              <option>Niedrig</option>
              <option selected>Mittel</option>
              <option>Hoch</option>
            </select>
          </label>

          <label>
            Schwerpunkt
            <input name="schwerpunkt" type="text" value="Verteidigung gegen Würgen" required />
          </label>

          <label class="full">
            Einschränkungen
            <input name="einschraenkungen" type="text" placeholder="z. B. keine Sprungbelastung" />
          </label>

          <button type="submit">Plan generieren</button>
        </form>
      </section>

      <section class="card">
        <h2>2) Generierter Trainingsplan</h2>
        <div id="planOutput" class="output"></div>
      </section>

      <section class="card">
        <h2>3) YAML-Ausgabe</h2>
        <pre id="yamlOutput" class="output"></pre>
      </section>

      <section class="card">
        <h2>4) KI-Prompt</h2>
        <pre id="promptOutput" class="output"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
